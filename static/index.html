<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Streaming</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
    }
    #startBtn:disabled, #stopBtn:disabled {
      background-color: #ccc;
    }
  </style>
</head>
<body>
  <h1>Audio Streaming to Server</h1>
  <button id="startBtn">Start Recording</button>
  <button id="stopBtn" disabled>Stop Recording</button>

  <script>
    let audioContext, processor, input, stream, socket;
    let recording = false;
    let bufferQueue = [];
    const chunkSize = 176400;

    document.getElementById("startBtn").onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        console.log("Microphone access granted");

        socket = new WebSocket("wss://" + location.host + "/ws/audio");
        socket.binaryType = "arraybuffer";

        audioContext = new AudioContext({ sampleRate: 44100 });
        input = audioContext.createMediaStreamSource(stream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);

        input.connect(processor);
        processor.connect(audioContext.destination);

        processor.onaudioprocess = (e) => {
          if (!recording || socket.readyState !== WebSocket.OPEN) return;

          const inputData = e.inputBuffer.getChannelData(0);
          const buffer = new ArrayBuffer(inputData.length * 2);
          const view = new DataView(buffer);

          for (let i = 0; i < inputData.length; i++) {
            let s = Math.max(-1, Math.min(1, inputData[i]));
            view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
          }

          bufferQueue.push(new Uint8Array(buffer));

          // Accumulate ~88,200 bytes (1 second of audio)
          const totalLength = bufferQueue.reduce((sum, b) => sum + b.length, 0);
          if (totalLength >= chunkSize) {
            const combined = new Uint8Array(totalLength);
            let offset = 0;
            for (let b of bufferQueue) {
              combined.set(b, offset);
              offset += b.length;
            }

            socket.send(combined.buffer); // Send to backend
            bufferQueue = []; // Clear for next chunk
            console.log("Sent chunk of", totalLength, "bytes");
          }
        };

        socket.onopen = () => {
          console.log("WebSocket opened");
          recording = true;
          document.getElementById("startBtn").disabled = true;
          document.getElementById("stopBtn").disabled = false;
        };

        socket.onclose = () => {
          console.log("WebSocket closed");
        };

        socket.onerror = (err) => {
          console.error("WebSocket error:", err);
        };

      } catch (err) {
        console.error("Microphone access denied or failed", err);
      }
    };

    document.getElementById("stopBtn").onclick = () => {
      recording = false;
      if (processor) processor.disconnect();
      if (input) input.disconnect();
      if (audioContext) audioContext.close();
      if (socket) socket.close();

      document.getElementById("startBtn").disabled = false;
      document.getElementById("stopBtn").disabled = true;
    };
  </script>
</body>
</html>
